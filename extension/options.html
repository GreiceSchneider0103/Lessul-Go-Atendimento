<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Lessul Go — Configurações</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 420px; color: #1e293b; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.muted { color: #64748b; font-size: 12.5px; margin: 0 0 16px; }
    label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12.5px; }
    #status.ok { color: #166534; }
    #status.error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Lessul Go — Importar Mercado Livre</h1>
  <p class="muted">Cole aqui o token gerado em "Extensão" dentro do sistema Lessul Go.</p>

  <label for="token">Token de acesso</label>
  <input id="token" type="password" placeholder="goat_pat_..." autocomplete="off" />

  <label for="apiBase">Endereço do sistema</label>
  <input id="apiBase" type="text" placeholder="https://lessul-go-atendimento-2p7t.onrender.com" />

  <button id="save">Salvar</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
